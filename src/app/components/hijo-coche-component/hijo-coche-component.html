<h1 style="color: blue;">
    {{car.marca}} {{car.modelo}}
</h1>

<h2 [ngClass]="{
    rojo: car.velocidad == 0,
    verde: car.velocidad > 0
}">
    velocidad actual: {{car.velocidad}} km/h
</h2>
<button (click)="acelerarCoche()">Acelerar</button>
<button (click)="frenarCoche()"> Frenar coche</button>
